<html>
    <head>
        <title>Number Notation With Words</title>
        <style>
            input[type=number]::-webkit-inner-spin-button,
            input[type=number]::-webkit-outer-spin-button {
                -webkit-appearance: none;
            }
        </style>
    </head>
    <body>
        <h1>Number Notation With Words</h1>
        <label for="input">Number input:&nbsp;</label>
        <input type="number" id="numI" min="0"><br>
        <label for="decimalsToKeepI">Decimals to keep (when is -1, then all decimals are kept):&nbsp;</label>
        <input type="number" id="decimalsToKeepI" min="-1" max="100"><br>
        <input type="button" value="Convert" onclick="clicked()">
        <p id="output"></p>
        <script>
            const numI = document.getElementById("numI");
            const decimalsToKeepI = document.getElementById("decimalsToKeepI");
            const output = document.getElementById("output");

            const suffixes = [
                [63, "vigintillion"],
                [60, "novemdecillion"],
                [57, "octodecillion"],
                [54, "septendecillion"],
                [51, "sexdecillion"],
                [48, "quindecillion"],
                [45, "quattuordecillion"],
                [42, "tredecillion"],
                [39, "duodecillion"],
                [36, "undecillion"],
                [33, "decillion"],
                [30, "nonillion"],
                [27, "octillion"],
                [24, "septillion"],
                [21, "sextillion"],
                [18, "quintillion"],
                [15, "quadrillion"],
                [12, "trillion"],
                [9, "billion"],
                [6, "million"],
                [3, "thousand"]
            ];

            function toNumberNotationWithWords(input, decimalsToKeep = -1) {
                let number = Number(input)
                if (isNaN(number)) return input
                for (let [power, suffix] of suffixes) {
                    if (number >= Math.pow(10, power)) {
                        let result = number / Math.pow(10, power);

                        return decimalsToKeep >= 0
                            ? result.toFixed(decimalsToKeep) + " " + suffix
                            : result + " " + suffix;
                    }
                }
                
                return number
            }

            function clicked() {
                if (input.value != "" && decimalsToKeepI.value != "") {
                    output.textContent = toNumberNotationWithWords(numI.value, decimalsToKeepI.value)
                }
            }

            input.addEventListener("keydown", e => {
                if (e.key == "Enter" && input.value != "" && decimalsToKeepI.value != "") {
                    output.textContent = toNumberNotationWithWords(numI.value, decimalsToKeepI.value)
                }
            })

            decimalsToKeepI.addEventListener("keydown", e => {
                if (e.key == "Enter" && input.value != "" && decimalsToKeepI.value != "") {
                    output.textContent = toNumberNotationWithWords(numI.value, decimalsToKeepI.value)
                }
            })
        </script>
    </body>
</html>
